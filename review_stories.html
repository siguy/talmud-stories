<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketubot Stories Review</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 32px;
            font-weight: bold;
            color: #3498db;
        }

        .stat-box .label {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 5px;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        select, input[type="range"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="range"] {
            padding: 0;
        }

        .range-value {
            color: #3498db;
            font-weight: bold;
            margin-left: 10px;
        }

        .story-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow: hidden;
            transition: box-shadow 0.3s;
        }

        .story-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .story-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .story-ref {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }

        .story-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .confidence-high {
            background: #d4edda;
            color: #155724;
        }

        .confidence-medium {
            background: #fff3cd;
            color: #856404;
        }

        .confidence-low {
            background: #f8d7da;
            color: #721c24;
        }

        .type-full_narrative {
            background: #cfe2ff;
            color: #084298;
        }

        .type-dialogue_vignette {
            background: #e7d6f5;
            color: #6f42c1;
        }

        .type-brief_anecdote {
            background: #d1e7dd;
            color: #0f5132;
        }

        .multi-page {
            background: #ff6b6b;
            color: white;
        }

        .story-content {
            padding: 20px;
        }

        .summary {
            background: #f0f7ff;
            padding: 15px;
            border-left: 4px solid #3498db;
            margin-bottom: 20px;
            font-style: italic;
            color: #2c3e50;
        }

        .text-section {
            margin-bottom: 20px;
        }

        .text-section h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .text-content {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 15px;
        }

        .hebrew {
            direction: rtl;
            text-align: right;
            font-family: 'Times New Roman', serif;
            font-size: 18px;
        }

        .text-container-sidebyside {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) {
            .text-container-sidebyside {
                grid-template-columns: 1fr;
            }
        }

        .text-controls {
            margin-bottom: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #3498db;
            color: #3498db;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: #3498db;
            color: white;
        }

        .toggle-text {
            background: none;
            border: none;
            color: #3498db;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }

        .toggle-text:hover {
            color: #2980b9;
        }

        .narrative-elements {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .element {
            padding: 6px 12px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 6px;
            font-size: 13px;
        }

        .feedback-section {
            padding: 20px;
            background: #f8f9fa;
            border-top: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .feedback-buttons {
            display: flex;
            gap: 10px;
        }

        .feedback-btn {
            padding: 10px 24px;
            border: 2px solid;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .feedback-btn.correct {
            background: white;
            border-color: #27ae60;
            color: #27ae60;
        }

        .feedback-btn.correct:hover,
        .feedback-btn.correct.active {
            background: #27ae60;
            color: white;
        }

        .feedback-btn.false-positive {
            background: white;
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .feedback-btn.false-positive:hover,
        .feedback-btn.false-positive.active {
            background: #e74c3c;
            color: white;
        }

        .feedback-note {
            flex: 1;
            min-width: 200px;
        }

        .feedback-note input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
        }

        .export-section {
            text-align: center;
            margin-top: 30px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .export-btn {
            padding: 15px 40px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .export-btn:hover {
            background: #2980b9;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
            font-size: 18px;
        }

        .hidden {
            display: none;
        }

        .reasoning {
            margin-top: 15px;
            padding: 15px;
            background: #fff9e6;
            border-left: 4px solid #f39c12;
            font-size: 14px;
            color: #2c3e50;
        }

        .reasoning strong {
            color: #f39c12;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Ketubot Stories Review</h1>
            <p>Review AI-identified stories from Tractate Ketubot and provide expert feedback</p>

            <div class="control-group" style="margin: 20px 0;">
                <label for="reviewerName">Reviewer Name</label>
                <input type="text" id="reviewerName" placeholder="Enter your name" style="max-width: 300px;">
            </div>

            <div class="stats" id="stats">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <div class="controls">
            <div class="filters">
                <div class="control-group">
                    <label>Search by Reference</label>
                    <input type="text" id="searchRef" placeholder="e.g., 62b, 67a, 103">
                </div>

                <div class="control-group">
                    <label>Story Type</label>
                    <select id="filterType">
                        <option value="all">All Types</option>
                        <option value="full_narrative">Full Narratives</option>
                        <option value="dialogue_vignette">Dialogue Vignettes</option>
                        <option value="brief_anecdote">Brief Anecdotes</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Minimum Confidence: <span class="range-value" id="confValue">0%</span></label>
                    <input type="range" id="filterConfidence" min="0" max="100" value="0">
                </div>

                <div class="control-group">
                    <label>Multi-Page Stories</label>
                    <select id="filterMultiPage">
                        <option value="all">All</option>
                        <option value="multipage">Multi-Page Only</option>
                        <option value="singlepage">Single-Page Only</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="storiesContainer">
            <!-- Populated by JavaScript -->
        </div>

        <div class="export-section">
            <h2>Export Your Feedback</h2>
            <p style="margin: 15px 0; color: #7f8c8d;">Download your expert review to share with the AI team</p>
            <button class="export-btn" onclick="exportFeedback()">📥 Download Feedback JSON</button>
        </div>
    </div>

    <script>
        let stories = [];
        let feedback = {};

        // Load ketubot_stories_complete.json
        async function loadStories() {
            try {
                const response = await fetch('ketubot_stories_complete.json');
                if (!response.ok) {
                    throw new Error('ketubot_stories_complete.json not found');
                }
                const data = await response.json();
                stories = data.stories || [];
                initializeApp();
            } catch (error) {
                document.getElementById('storiesContainer').innerHTML = `
                    <div class="no-results">
                        <h2>⚠️ ketubot_stories_complete.json not found</h2>
                        <p>Please run the merge script first:</p>
                        <code style="display: block; margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                            python3 merge_stories.py
                        </code>
                        <p>This will generate ketubot_stories_complete.json with both a and b pages.</p>
                    </div>
                `;
            }
        }

        function initializeApp() {
            updateStats();
            renderStories();
            setupEventListeners();
        }

        function updateStats() {
            const multiPage = stories.filter(s => s.spans_multiple_pages).length;
            const avgConfidence = stories.reduce((sum, s) => sum + s.analysis.confidence, 0) / stories.length;
            const highConf = stories.filter(s => s.analysis.confidence >= 90).length;

            const types = {};
            stories.forEach(s => {
                types[s.analysis.story_type] = (types[s.analysis.story_type] || 0) + 1;
            });

            document.getElementById('stats').innerHTML = `
                <div class="stat-box">
                    <div class="number">${stories.length}</div>
                    <div class="label">Total Stories</div>
                </div>
                <div class="stat-box">
                    <div class="number">${avgConfidence.toFixed(0)}%</div>
                    <div class="label">Avg Confidence</div>
                </div>
                <div class="stat-box">
                    <div class="number">${highConf}</div>
                    <div class="label">High Confidence (90%+)</div>
                </div>
                <div class="stat-box">
                    <div class="number">${multiPage}</div>
                    <div class="label">Multi-Page</div>
                </div>
            `;
        }

        function renderStories() {
            const searchTerm = document.getElementById('searchRef').value.toLowerCase();
            const typeFilter = document.getElementById('filterType').value;
            const confFilter = parseInt(document.getElementById('filterConfidence').value);
            const multiPageFilter = document.getElementById('filterMultiPage').value;

            const filtered = stories.filter(story => {
                if (searchTerm && !story.ref.toLowerCase().includes(searchTerm)) return false;
                if (typeFilter !== 'all' && story.analysis.story_type !== typeFilter) return false;
                if (story.analysis.confidence < confFilter) return false;
                if (multiPageFilter === 'multipage' && !story.spans_multiple_pages) return false;
                if (multiPageFilter === 'singlepage' && story.spans_multiple_pages) return false;
                return true;
            });

            if (filtered.length === 0) {
                document.getElementById('storiesContainer').innerHTML = '<div class="no-results">No stories match your filters</div>';
                return;
            }

            document.getElementById('storiesContainer').innerHTML = filtered.map((story, index) => {
                const confidenceClass = story.analysis.confidence >= 90 ? 'high' :
                                       story.analysis.confidence >= 75 ? 'medium' : 'low';

                const elements = Object.entries(story.analysis.narrative_elements)
                    .filter(([key, value]) => value)
                    .map(([key]) => key.replace('has_', '').replace('_', ' '));

                const storyFeedback = feedback[story.ref] || { type: null, note: '' };

                return `
                    <div class="story-card">
                        <div class="story-header">
                            <div class="story-ref">${story.ref}</div>
                            <div class="story-meta">
                                <span class="badge confidence-${confidenceClass}">${story.analysis.confidence}% Confidence</span>
                                <span class="badge type-${story.analysis.story_type}">${story.analysis.story_type.replace('_', ' ')}</span>
                                ${story.spans_multiple_pages ? '<span class="badge multi-page">Multi-Page</span>' : ''}
                            </div>
                        </div>

                        <div class="story-content">
                            ${story.analysis.one_sentence_summary ? `
                                <div class="summary">
                                    <strong>Summary:</strong> ${story.analysis.one_sentence_summary}
                                </div>
                            ` : ''}

                            <div class="text-controls">
                                <button class="control-btn" onclick="adjustLength('${story.ref}', 'expand')">
                                    ➕ Expand Context
                                </button>
                                <button class="control-btn" onclick="adjustLength('${story.ref}', 'shrink')">
                                    ➖ Shrink
                                </button>
                                <span style="margin-left: 15px; color: #7f8c8d; font-size: 14px;">
                                    Adjust if story seems cut off or too long
                                </span>
                            </div>

                            <div class="text-container-sidebyside">
                                <div class="text-section">
                                    <h3>📖 English Translation</h3>
                                    <div class="text-content" id="eng-${index}">
                                        ${story.text}
                                    </div>
                                </div>

                                ${story.hebrew_text ? `
                                    <div class="text-section">
                                        <h3>🕎 Hebrew/Aramaic Original</h3>
                                        <div class="text-content hebrew" id="heb-${index}">
                                            ${story.hebrew_text}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>

                            <div class="reasoning">
                                <strong>AI Reasoning:</strong> ${story.analysis.reasoning}
                            </div>

                            <div class="narrative-elements">
                                ${elements.map(el => `<span class="element">✓ ${el}</span>`).join('')}
                            </div>
                        </div>

                        <div class="feedback-section">
                            <div>
                                <strong style="color: #2c3e50;">Is this a correct story identification?</strong>
                            </div>
                            <div class="feedback-buttons">
                                <button class="feedback-btn correct ${storyFeedback.type === 'correct' ? 'active' : ''}"
                                        onclick="markFeedback('${story.ref}', 'correct')">
                                    ✓ Correct
                                </button>
                                <button class="feedback-btn false-positive ${storyFeedback.type === 'false_positive' ? 'active' : ''}"
                                        onclick="markFeedback('${story.ref}', 'false_positive')">
                                    ✗ False Positive
                                </button>
                            </div>
                            <div class="feedback-note">
                                <input type="text"
                                       placeholder="Optional notes..."
                                       value="${storyFeedback.note}"
                                       onchange="updateNote('${story.ref}', this.value)">
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setupEventListeners() {
            document.getElementById('searchRef').addEventListener('input', renderStories);
            document.getElementById('filterType').addEventListener('change', renderStories);
            document.getElementById('filterMultiPage').addEventListener('change', renderStories);

            document.getElementById('filterConfidence').addEventListener('input', (e) => {
                document.getElementById('confValue').textContent = e.target.value + '%';
                renderStories();
            });
        }

        function toggleText(id) {
            const element = document.getElementById(id);
            element.classList.toggle('hidden');
        }

        function markFeedback(ref, type) {
            if (!feedback[ref]) {
                feedback[ref] = { type: null, note: '', length_adjustment: null };
            }

            // Toggle if clicking same button, otherwise set new type
            if (feedback[ref].type === type) {
                feedback[ref].type = null;
            } else {
                feedback[ref].type = type;
            }

            renderStories();
        }

        function updateNote(ref, note) {
            if (!feedback[ref]) {
                feedback[ref] = { type: null, note: '', length_adjustment: null };
            }
            feedback[ref].note = note;
        }

        function adjustLength(ref, action) {
            if (!feedback[ref]) {
                feedback[ref] = { type: null, note: '', length_adjustment: null };
            }

            feedback[ref].length_adjustment = action;

            alert(
                action === 'expand'
                    ? `✓ Marked "${ref}" for expansion.\n\nNote: This is recorded in your feedback. The actual text expansion would require re-fetching from Sefaria API with additional context lines.`
                    : `✓ Marked "${ref}" for shrinking.\n\nNote: This is recorded in your feedback to indicate the story boundaries should be tighter.`
            );

            renderStories();
        }

        function exportFeedback() {
            const reviewerName = document.getElementById('reviewerName').value.trim();

            if (!reviewerName) {
                alert('⚠️ Please enter your name before exporting feedback');
                document.getElementById('reviewerName').focus();
                return;
            }

            const exportData = {
                reviewer_name: reviewerName,
                reviewed_at: new Date().toISOString(),
                tractate: 'Ketubot',
                total_stories: stories.length,
                reviewed_count: Object.keys(feedback).length,
                feedback: Object.entries(feedback).map(([ref, data]) => {
                    const story = stories.find(s => s.ref === ref);
                    return {
                        ref: ref,
                        feedback_type: data.type,
                        notes: data.note,
                        length_adjustment: data.length_adjustment,
                        story_confidence: story?.analysis.confidence,
                        story_type: story?.analysis.story_type,
                        spans_multiple_pages: story?.spans_multiple_pages
                    };
                })
            };

            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ketubot_review_${reviewerName.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alert(`✓ Exported feedback for ${Object.keys(feedback).length} stories!`);
        }

        // Load saved reviewer name from localStorage
        function loadReviewerName() {
            const savedName = localStorage.getItem('reviewerName');
            if (savedName) {
                document.getElementById('reviewerName').value = savedName;
            }
        }

        // Save reviewer name to localStorage when it changes
        function saveReviewerName() {
            const nameInput = document.getElementById('reviewerName');
            nameInput.addEventListener('input', () => {
                localStorage.setItem('reviewerName', nameInput.value.trim());
            });
        }

        // Initialize on load
        loadStories();
        loadReviewerName();
        saveReviewerName();
    </script>
</body>
</html>
